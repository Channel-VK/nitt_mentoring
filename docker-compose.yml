version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: nitt-mentoring-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mentoring
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mentoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  nitt-mentoring:
    container_name: nitt-mentoring
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1920:1920"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:secret123@postgres:5432/mentoring?schema=public
      JWT_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      BCRYPT_SALT: "10"
      PORT: 1920
      NITRO_PORT: 1920
      HOST: 0.0.0.0
      NODE_ENV: production
      FRONTEND_URL: "http://localhost:1920"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "AdminPassword123"

volumes:
  postgres_data:
